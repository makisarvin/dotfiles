# BEGIN_KITTY_THEME
# Aether
include current-theme.conf
# END_KITTY_THEME
#
font_family JetBrainsMono Nerd Font
# font_family CaskaydiaCove Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 10

# Window
window_padding_width      10
hide_window_decorations   yes

# Keybindinds
# map ctrl+c copy_to_clipboard
# map ctrl+v paste_from_clipboard


# Aesthetics
disable_ligatures         no
enable_audio_bell         no

background_opacity        0.85

# mappings (includes default mapping for clarity)
# kitty_mod == ctrl+shift or cmd in macos
# kitty_mod+enter           - new window
#
# from: https://hexmos.com/freedevtools/c/ide_editors/kitty/
#
# ############################
# # Fonts and clipboard
# #############################
# ctrl+shift+c         - Copy to clipboard	    
# ctrl+shift+v         - Paste from clipboard	
# ctrl+shift+s         - Paste from selection	
# ctrl+shift+equal     - Increase font size	
# ctrl+shift+minus     - Decrease font size	
# ctrl+shift+backspace - Restore font size
#
# ############################
# Tabs
# ############################
# ctrl+shift+t         - New tab
# ctrl+shift+q         - Close tab
# ctrl+shift+right     - Next tab
# ctrl+shift+left      - Previous tab
# ctrl+shift+l         - Next layout [overriden]
# ctrl+shift+.         - Move tab forward
# ctrl+shift+,         - Move tab backward
# ctrl+shift+alt+t     - Set tab title
#
# #############################
# # Windows
# ############################
# ctrl+shift+enter     - New window
# ctrl+shift+n         - New OS window
# ctrl+shift+w         - Close window
# ctrl+shift+]         - Next window
# ctrl+shift+[         - Previous window
# ctrl+shift+f         - Move window forward
# ctrl+shift+b         - Move window backward
# ctrl+shift+`         - Move window to top
# ctrl+shift+f7        - Visually focus window
# ctrl+shift+f8        - Visually swap window
map ctrl+shift+k next_window
map ctrl+shift+j previous_window



# #############################
# SESSIONS
# #############################
map ctrl+shift+s save_as_session --use-foreground-process --relocatable

map ctrl+shift+1 goto_session ~/config/kitty/sessions 

map ctrl+shift+2 goto_session ~/.config/kitty/sessions/dev.kitty-session

# Create a new window splitting the space used by the existing one so that
# the two windows are placed one above the other
map f5 launch --location=hsplit

# Create a new window splitting the space used by the existing one so that
# the two windows are placed side by side
map f6 launch --location=vsplit

# swap windows
map shift+up move_window up
map shift+left move_window left
map shift+right move_window right
map shift+down move_window down
